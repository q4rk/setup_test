name: 'Gemini Review Reusable'

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.mint_identity_token.outputs.token || github.token }}
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Load Gemini Configurations for PR Review
        id: config
        working-directory: .gemini/ci/pr-review
        run: |
          {
            echo "settings<<EOF"
            cat settings.json
            echo ""
            echo "EOF"

            echo "extensions<<EOF"
            cat extensions.json
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI for PR Review
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token || github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        with:
          # Authentication inputs
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          use_vertex_ai: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI == 'true' }}
          use_gemini_code_assist: ${{ vars.GOOGLE_GENAI_USE_GCA == 'true' }}
          
          # Execution inputs
          gemini_model: 'gemini-2.5-flash'
          prompt: '/gemini-review'
          settings: ${{ steps.config.outputs.settings }}
          extensions: ${{ steps.config.outputs.extensions }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}