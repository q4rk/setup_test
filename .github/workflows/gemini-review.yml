name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: 'Cache Gemini CLI and extensions'
        id: 'gemini-cache'
        uses: 'actions/cache@v4'
        with:
          path: |
            ~/.gemini
            ~/.npm
          key: ${{ runner.os }}-gemini-cli-${{ hashFiles('.github/workflows/gemini-review.yml') }}
          restore-keys: |
            ${{ runner.os }}-gemini-cli-

      - name: 'Install Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20'

      - name: 'Install Gemini CLI and Extensions'
        shell: 'bash'
        run: |
          # Install gemini-cli globally if not already installed
          if ! command -v gemini &> /dev/null; then
            echo "Installing Gemini CLI..."
            npm install -g @google/gemini-cli@latest
          else
            echo "Gemini CLI already installed (restored from cache)."
          fi
          
          # Install extension, ignore/continue if already installed
          echo "Installing extension..."
          echo "Y" | gemini extensions install "https://github.com/gemini-cli-extensions/code-review" || true

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini Pull Request Review'
        shell: 'bash'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          PROMPT: '/pr-code-review'
        run: |
          # Configure settings.json
          mkdir -p ~/.gemini
          cat << EOF > ~/.gemini/settings.json
          {
            "model": {
              "maxSessionTurns": 25
            },
            "telemetry": {
              "enabled": false
            },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run",
                  "-i",
                  "--rm",
                  "-e",
                  "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.27.0"
                ],
                "includeTools": [
                  "add_comment_to_pending_review",
                  "pull_request_read",
                  "pull_request_review_write"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                }
              }
            },
            "tools": {
              "core": []
            }
          }
          EOF
          
          # Execute gemini CLI with debug enabled to stream logs
          gemini --debug --yolo --prompt "${PROMPT}" --output-format json
