name: 'Gemini Review Reusable'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        required: false
        description: 'Any additional context'
      gcp_workload_identity_provider:
        type: 'string'
        required: false
        description: 'GCP Workload Identity Provider'
      gcp_service_account:
        type: 'string'
        required: false
        description: 'GCP Service Account'
      gcp_project_id:
        type: 'string'
        required: false
        description: 'GCP Project ID'
      gcp_location:
        type: 'string'
        required: false
        description: 'GCP Location'
      use_vertex_ai:
        type: 'boolean'
        required: false
        default: false
        description: 'Whether to use Vertex AI'
      use_gemini_code_assist:
        type: 'boolean'
        required: false
        default: false
        description: 'Whether to use Gemini Code Assist'
      app_id:
        type: 'string'
        required: false
        description: 'Custom GitHub App ID'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Load Gemini Configurations for PR Review
        id: config
        working-directory: .gemini/ci/pr-review
        run: |
          {
            echo "settings<<EOF"
            cat settings.json
            echo ""
            echo "EOF"

            echo "extensions<<EOF"
            cat extensions.json
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI for PR Review
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        with:
          # Authentication inputs
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}
          gcp_project_id: ${{ inputs.gcp_project_id }}
          gcp_location: ${{ inputs.gcp_location }}
          use_vertex_ai: ${{ inputs.use_vertex_ai }}
          use_gemini_code_assist: ${{ inputs.use_gemini_code_assist }}
          
          # Execution inputs
          gemini_model: 'gemini-2.5-flash'
          gemini_debug: 'true'
          prompt: '/pr-review'
          settings: ${{ steps.config.outputs.settings }}
          extensions: ${{ steps.config.outputs.extensions }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}