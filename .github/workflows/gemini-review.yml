name: 'Gemini Review Reusable'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        required: false
        description: 'Any additional context'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Load Gemini Configurations for PR Review
        id: config
        working-directory: .gemini/ci/pr-review
        run: |
          {
            echo "settings<<EOF"
            cat settings.json
            echo ""
            echo "EOF"

            echo "prompt<<EOF"
            echo "/pr-code-review"
            echo ""
            cat PROMPT.md
            echo ""
            echo "EOF"

            echo "extensions<<EOF"
            cat extensions.json
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI for PR Review
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-2.5-flash'
          prompt: ${{ steps.config.outputs.prompt }}
          settings: ${{ steps.config.outputs.settings }}
          extensions: ${{ steps.config.outputs.extensions }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}