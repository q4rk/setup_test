name: 'Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
        
concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Load Gemini Configurations for PR Review
        id: config
        working-directory: .gemini/ci/pr-review
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
        run: |
          python3 -c '
          import os
          content = open("PROMPT.md").read()
          content = content.replace("${REPOSITORY}", os.environ["REPOSITORY"])
          content = content.replace("${PULL_REQUEST_NUMBER}", os.environ["PULL_REQUEST_NUMBER"])
          content = content.replace("${ADDITIONAL_CONTEXT}", os.environ.get("ADDITIONAL_CONTEXT", ""))
          open("PROMPT_RESOLVED.md", "w").write(content)
          '

          echo "=== DEBUG: PROMPT_RESOLVED.md ==="
          cat PROMPT_RESOLVED.md
          echo "=================================="

          {
            echo "settings<<EOF"
            cat settings.json
            echo ""
            echo "EOF"

            echo "prompt<<EOF"
            cat PROMPT_RESOLVED.md
            echo ""
            echo "EOF"

            echo "extensions<<EOF"
            cat extensions.json
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI for PR Review
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          workflow_name: 'gemini-review'
          gemini_cli_version: 'latest'
          gemini_model: 'gemini-2.5-flash'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ github.event.pull_request.number }}'
          prompt: ${{ steps.config.outputs.prompt }}
          settings: ${{ steps.config.outputs.settings }}
          extensions: ${{ steps.config.outputs.extensions }}
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || true) }}'