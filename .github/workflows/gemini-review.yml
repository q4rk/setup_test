name: '🔎 Gemini Code Review'

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: 'read'
  pull-requests: 'write'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: 'Load Code Review Settings'
        id: 'load_settings'
        shell: 'bash'
        run: |
          echo "settings<<EOF" >> "${GITHUB_OUTPUT}"
          cat .gemini/code-review/settings.json >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: 'Load Code Review Prompt'
        id: 'load_prompt'
        shell: 'bash'
        run: |
          echo "prompt<<EOF" >> "${GITHUB_OUTPUT}"
          echo "/pr-code-review" >> "${GITHUB_OUTPUT}"
          echo "" >> "${GITHUB_OUTPUT}"
          cat .gemini/code-review/PROMPT.md >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: 'Run Gemini CLI'
        uses: 'google-github-actions/run-gemini-cli@v0.1.22'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_model: 'gemini-2.5-flash'
          prompt: '${{ steps.load_prompt.outputs.prompt }}'
          settings: '${{ steps.load_settings.outputs.settings }}'
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
